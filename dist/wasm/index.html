<html data-theme="light" lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="description"
      content="HP 48GX calculator emulator running in your browser: the x48ng Saturn CPU emulator compiled to WebAssembly, with Web Serial support and persistent state."
    />

    <link href="https://hp48.autric.net/" rel="canonical" />

    <!-- Open Graph (Facebook, LinkedIn, and most other link previews). -->

    <meta property="og:site_name" content="Greg. I/O" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://hp48.autric.net/" />
    <meta property="og:title" content="HP 48GX emulator in WebAssembly" />
    <meta
      property="og:description"
      content="Run an HP 48GX calculator in your browser: x48ng compiled to WebAssembly, with Web Serial support and persistent state."
    />
    <meta property="og:image" content="https://hp48.autric.net/og-image.png" />
    <meta property="og:image:secure_url" content="https://hp48.autric.net/og-image.png" />

    <meta property="og:image:alt" content="HP 48GX calculator emulator running the Minehunt game" />

    <!-- X (Twitter) card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HP 48GX emulator in WebAssembly" />
    <meta
      name="twitter:description"
      content="Run an HP 48GX calculator in your browser: x48ng compiled to WebAssembly, with Web Serial support and persistent state."
    />
    <meta name="twitter:image" content="https://hp48.autric.net/og-image.png" />
    <meta name="twitter:image:alt" content="HP 48GX calculator emulator running the Minehunt game" />
    <!-- Site-wide PaperMod theme, then the emulator-page styles. Both are
         vendored locally so the page runs without any network access. -->
    <link href="stylesheet.css" rel="stylesheet" />
    <link href="x48ng.css" rel="stylesheet" />
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <div class="logo">
          <a href="https://g.autric.net/" title="Greg. I/O">Greg. I/O</a>
        </div>
        <ul id="menu">
          <li><a href="https://g.autric.net/apropos/" title="About"><span>About</span></a></li>
          <li><a href="https://g.autric.net/blog/" title="Blog"><span>Blog</span></a></li>
          <li><a href="https://g.autric.net/other/" title="Other"><span class="active">Other</span></a></li>
          <li><a href="https://g.autric.net/contact/" title="Contact"><span>Contact</span></a></li>
        </ul>
      </nav>
    </header>

    <main class="main">
      <article class="post-single">
        <header class="post-header">
          <h1 class="entry-hint-parent post-title">HP 48 <span id="model-badge">GX</span> WebAssembly</h1>
          <div class="post-meta">
            Saturn CPU emulator compiled to WebAssembly · Serial port &amp; state persistence run in the browser<br />
            Original (non-WebAssembly) source available on
            <a href="https://codeberg.org/gwh/x48ng" rel="noopener" target="_blank">Codeberg</a>.
          </div>
        </header>

        <div class="post-content">
          <div id="calc-col">
            <div id="status">Downloading…</div>
            <progress id="progress" max="100" value="0"></progress>
            <canvas
              class="emscripten"
              id="canvas"
              oncontextmenu="event.preventDefault()"
              tabindex="0"
            ></canvas>
            <div id="controls">
              <div class="serial-row">
                <button id="serial-btn" type="button" disabled>
                  <svg
                    class="btn-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M12 22v-5" />
                    <path d="M9 8V2" />
                    <path d="M15 8V2" />
                    <path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z" />
                  </svg>
                  <span id="serial-label">Connect serial</span>
                </button>
                <span id="serial-status">Serial: initialising…</span>
              </div>
              <button id="clear-btn" type="button" title="Erase all HP 48 memory and restart empty">
                <svg
                  class="btn-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                  <path d="M21 3v5h-5" />
                </svg>
                <span class="btn-label">Clear memory &amp; reload</span>
              </button>
            </div>
          </div>
        </div>
      </article>
    </main>

    <footer class="footer">
      <span>© 2016 - 2026 <a href="https://g.autric.net/">Greg. I/O</a></span>
    </footer>

    <!-- Browser glue must exist before the emscripten runtime boots. -->
    <script src="x48ng-ui.js"></script>
    <script async src="x48ng.js"></script>
  </body>
</html>
